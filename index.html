<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>Camp Pedidos</title>
    <meta name="description" content="Central hub para todas as nossas lojas e parceiros de delivery." />
    <!-- PWA -->
    <meta name="theme-color" content="#e53935" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#E53935",
                        "background-light": "#f6f7f8",
                        "background-dark": "#1b1313",
                    },
                    fontFamily: {
                        "sans": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px " },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
    <div id="app-splash" class="campp-splash" role="status" aria-live="polite" aria-label="Carregando Camp Pedidos">
        <div class="campp-splash-bg"></div>
        <div class="campp-splash-content">
            <div class="campp-splash-logo-wrap">
                <div class="campp-splash-logo">
                    <span class="material-symbols-outlined text-[42px]">storefront</span>
                </div>
                <div class="campp-splash-ring"></div>
            </div>
            <h1 class="campp-splash-title">Camp<span>Pedidos</span></h1>
            <p class="campp-splash-subtitle">Carregando lojas e avaliações</p>
            <div class="campp-splash-bar"><span></span></div>
        </div>
    </div>
    <!-- Header / Navbar -->
    <header class="campp-safe-header sticky top-0 z-50 glass-panel border-b border-white/50 dark:border-white/5">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 gap-3 sm:gap-8 min-w-0">
                <!-- Logo -->
                <div class="flex items-center gap-3 min-w-0">
                    <div
                        class="size-10 rounded-xl bg-gradient-to-br from-primary to-red-700 flex items-center justify-center text-white shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined text-[24px]">storefront</span>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white truncate">
                        Camp<span class="text-primary">Pedidos</span></h1>
                </div>
                <!-- Global Search -->
                <div class="flex-1 max-w-2xl hidden md:block">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span
                                class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">search</span>
                        </div>
                        <input
                            class="block w-full pl-11 pr-4 py-3 rounded-xl bg-slate-100/50 dark:bg-slate-800/50 border-transparent focus:border-primary focus:bg-white dark:focus:bg-slate-800 focus:ring-0 transition-all placeholder:text-slate-400 text-sm"
                            placeholder="Buscar por lojas, cardápios, ou produtos..." type="text" />
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                    <button
                        class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors hidden sm:inline-flex">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <button
                        class="flex items-center gap-2 pl-1 pr-2 sm:pr-3 py-1 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <span
                            class="material-symbols-outlined rounded-full p-1 bg-slate-100 dark:bg-slate-700">person</span>
                        <span class="text-sm font-medium hidden sm:block">Login</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 max-w-[1440px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 gap-8">
        <!-- Sidebar Navigation -->
        <aside class="w-64 hidden lg:flex flex-col gap-8 shrink-0 sticky top-28 h-[calc(100vh-9rem)]">
            <!-- Category Menu -->
            <div id="category-list" class="flex flex-col gap-1 overflow-y-auto custom-scrollbar pr-2 pb-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-3">Categorias</h3>
                <!-- Categories injected here -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 min-w-0">
            <!-- Page Header & Filters -->
            <div class="mb-8 space-y-6">
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h2 class="text-3xl font-bold tracking-tight mb-2">Lojas Parceiras</h2>
                        <p class="text-slate-500 dark:text-slate-400">Encontramos <span
                                class="text-primary font-semibold" id="store-count">0</span> opções disponíveis para
                            você.</p>
                    </div>
                </div>

                <!-- Active Filter Tags -->
                <div class="flex flex-wrap gap-2" id="tag-list">
                </div>
            </div>

            <!-- Store Cards List (Injected via JS) -->
            <div id="org-list" class="flex flex-col gap-5">
                <!-- Cards injected here -->
            </div>
        </main>
    </div>

    <div id="campp-phone-recaptcha" style="position:fixed;left:-9999px;top:-9999px;" aria-hidden="true"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-votes.js"></script>
    <script src="js/script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js></script>`r`n <script src=https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js></script>`r`n <script src=https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js></script>`r`n <script src=https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js></script>`r`n</body>

</html>
